<template>

    [id="f05-control-bg"] { position:absolute; inset:0; background:#c5f277; }
    [id="f05-control-content"] { position:absolute; inset:0; }
    [id="f05-control-kicker"] { position:absolute; left:5.5cqw; top:5.2cqh; font:500 1.04cqw monospace; letter-spacing:.14em; color:rgba(17,17,17,.75); }

    [id="f05-control-sample"] { position:absolute; right:5.5cqw; top:59cqh; font:500 1.4cqw monospace; color:rgba(17,17,17,.75); }
    [id="f05-control-evidence"] { position:absolute; left:5.5cqw; right:5.5cqw; top:66cqh; border-top:1px solid rgba(17,17,17,.2); padding-top:1.6cqh; font-size:2cqw; font-weight:400; letter-spacing:-.015em; }
    [id="f05-control-footer"] { position:absolute; left:5.5cqw; top:77cqh; margin:0; font-size:1.4cqw; line-height:1.5; color:rgba(17,17,17,.75); }
  </style>
  <div data-hf-id="hf-5tkf" id="root" data-composition-id="05-control" data-duration="10" data-width="1920" data-height="1080">
    <div data-hf-id="hf-wavu" id="f05-control-bg" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
    <div data-hf-id="hf-p425" id="f05-control-content" class="clip" data-start="0" data-duration="10" data-track-index="1">
      <div data-hf-id="hf-rowo" id="f05-control-kicker">OUTAGE CONTROL / 05</div>
      <h1 data-hf-id="hf-3t2q" id="f05-control-title">change one test. learn more.</h1>
      <div data-hf-id="hf-tes6" id="f05-control-result"><span data-hf-id="hf-kyvk" id="f05-control-count">3 / 3</span><span data-hf-id="hf-e75e" id="f05-control-passed">passed</span></div>
      <p data-hf-id="hf-fm9v" id="f05-control-label">distinct-vendor outage control</p>
      <div data-hf-id="hf-98fz" id="f05-control-sample">3 trials · small sample</div>
      <div data-hf-id="hf-chyy" id="f05-control-evidence">3 payment timeouts + 1 ledger timeout per trial</div>

  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      const el = suffix => document.getElementById('f05-control-' + suffix);
      const tl = gsap.timeline({paused:true});
      window.__timelines = window.__timelines || {};
      window.__timelines['05-control'] = tl;
      tl.fromTo(el('kicker'),{opacity:0},{opacity:1,duration:.35},0);
      tl.fromTo(el('title'),{opacity:0,x:-36,y:18},{opacity:1,x:0,y:0,duration:.6,ease:'power3.out'},.05);
      // Content-length timing is precomputed once within the result's fixed phase.
      const content = [
        {id:'count',text:'3 / 3'},
        {id:'passed',text:'passed'},
        {id:'label',text:'distinct-vendor outage control'}
      ];
      const weights = content.map(item => .6 + .035 * item.text.length);
      const totalWeight = weights.reduce((sum,n) => sum+n,0);
      let cursor=3;
      const sequence=content.map((item,i) => {
        const entry={...item,start:cursor};
        cursor+=1.8*weights[i]/totalWeight;
        return entry;
      });
      sequence.forEach(item => tl.fromTo(el(item.id),{opacity:0,y:22},{opacity:1,y:0,duration:.6,ease:'power3.out'},item.start));
      tl.fromTo(el('sample'),{opacity:0,y:12},{opacity:1,y:0,duration:.45,ease:'power2.out'},5.1);
      tl.fromTo(el('evidence'),{opacity:0,y:18},{opacity:1,y:0,duration:.55,ease:'power2.out'},6.2);
      tl.fromTo(el('footer'),{opacity:0,y:12},{opacity:1,y:0,duration:.6,ease:'power2.out'},8.15);
      tl.to({}, {duration:1.25},8.75);
    })();
  </script>
