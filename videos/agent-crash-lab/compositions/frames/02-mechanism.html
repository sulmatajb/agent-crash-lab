    (function () {

      window.__timelines = window.__timelines || {};
      window.__timelines['02-mechanism'] = tl;
      // Adapted line-by-line-slide: directional entrance, deterministic paused timeline.
      tl.fromTo(el('kicker'), {opacity:0}, {opacity:1,duration:.35}, 0);

      // Precompute content-length pacing within each locked scene window.
      function sequence(items, start, span) {
        const weights = items.map(item => .6 + item.text.length * .035);
        const sum = weights.reduce((a,b) => a+b, 0);
        let cumulative = start;
        return items.map((item,index) => {
          const entry = {...item,start:cumulative};
          cumulative += span * weights[index] / sum;
          return entry;
        });
      }

        {id:'agent',text:'Claude / Hermes'},
        {id:'tools',text:'local MCP tools'},
        {id:'world',text:'stateful test world'}
